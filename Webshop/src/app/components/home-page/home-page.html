<div class="container-fluid">
  <div class="row my-5">
    <div class="col-lg-12 d-flex justify-content-center align-items-center">
      <img src="assets/heroImg.jpg" alt="" />
    </div>
  </div>

  <div class="row my-5">
    <div class="col-lg-12">
      <h1 class="text-center mb-4">Legnépszerűbb termékeink</h1>

      <div class="container-fluid">
        <div class="row">
          @for (book of successfullyBooks; track $index) {
            <div class="col-lg-4">
              <app-product-card [productDetail]="book"/>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
