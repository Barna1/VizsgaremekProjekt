<div class="container-fluid" id="mainContainer">
  <div class="row h-100">
    <div class="col-lg-12 h-100 d-flex justify-content-between align-items-center">
      <div>
        <img src="assets/logo.png" alt="konyvaura_logo" routerLink="/homePage">

        <a routerLink="/productList">Termékek</a>
        <a routerLink="/publisherList">Kiadók</a>
        <a routerLink="#">Sikerlista</a>
        <a routerLink="#">Újdonságok</a>
        @if (userService.loggedUser?.role?.name == "ROLE_admin") {
          <a routerLink="/adminPage">Admin</a>
        }
      </div>

      <div class="d-flex justify-content-center">
        <button (click)="navigateUserButton()" class="mx-2 d-flex justify-content-center align-items-center">
          <span class="material-symbols-outlined">account_circle</span>
        </button>
        <button routerLink="/orderPage/basket" class="mx-2 d-flex justify-content-center align-items-center">
          <span class="material-symbols-outlined">shopping_cart</span>
        </button>
      </div>
    </div>
  </div>
</div>
