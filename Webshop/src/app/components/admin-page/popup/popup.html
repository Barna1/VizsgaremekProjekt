<div class="container-fluid" id="mainContainer">
  <div class="row h-100">
    <div class="col-lg-12 h-100 d-flex justify-content-center align-items-center">
      <div class="container-fluid d-flex flex-column justify-content-between" id="secondContainer">
        <div class="row">
          <div class="col-lg-12 d-flex justify-content-between align-items-center">
            @if (showForm || showDelete) {
              <button class="iconButton" (click)="showDelete = false; showForm = false; selectedIdForEdit = null">
                <span class="material-symbols-outlined">undo</span>
              </button>
            } @else {
              <div style="width: 40px; height: 40px;"></div>
            }
            <h1 class="text-center">title</h1>
            <button (click)="close.emit()" class="iconButton">
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12" style="overflow-y: auto; height: 480px;">
            @if (!showDelete && !showForm) {
              @for (card of cardList; track $index) {
                <app-list-card [card]="{id: card.id, name: card.name}" (delete)="selectedIdForDelete.set($event); showDelete = true; nameForDelete = card.name" (edit)="selectedIdForEdit = $event; showForm = true"/>
              }
            } @else if (showForm) {
              <app-object-editor [id]="selectedIdForEdit" [selectedType]="selectedType()" />
            } @else if (selectedIdForDelete != null) {
              <div class="container-fluid">
                <div class="row">
                  <div class="col-lg-12">
                    <h4 class="text-center">Biztosan törölni szeretnéd a(z) {{nameForDelete}}</h4>
                    <div class="w-100 d-flex justify-content-center align-items-center">
                      <button class="eventButton deleteButton mx-2 text-white" (click)="deleteObject()">Igen</button>
                      <button class="eventButton deleteButton mx-2 text-white" (click)="selectedIdForDelete.set(null)">Nem</button>
                    </div>
                  </div>
                </div>
              </div>
            }
          </div>
        </div>

        <div class="row">
          <div class="col-lg-12 mb-3">
            <button class="w-100 text-white eventButton" (click)="handleEventButton('showForm', selectedIdForEdit)" [disabled]="showForm && adminService.editorForm.invalid">
              hozzáadás
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
