<div class="container-fluid mb-5">
  <div class="row p-4 flex-lg-row flex-column">
    <div class="col-lg-8 d-flex flex-column justify-content-center align-items-start my-lg-0 my-4">
      <h2 class="m-0 w-100 text-lg-start text-center">{{book().basketBook.title}}</h2>
      <h4 class="m-0 w-100 text-lg-start text-center">Rövid leírás</h4>
    </div>
    <div class="col-lg-4">
      <div class="container-fluid d-flex flex-column align-items-lg-end align-items-center justify-content-center">
        <div class="row mb-2">
          <div class="col-lg-12 d-flex justify-content-center align-items-center">
            <button class="iconButton" (click)="changeAmountOfProduct(-1)">
              <span class="material-symbols-outlined">remove</span>
            </button>
            <span id="amountSpan" class="mx-3">{{book().amount}} db</span>
            <button class="iconButton" (click)="changeAmountOfProduct(1)">
              <span class="material-symbols-outlined">add</span>
            </button>
          </div>
        </div>

        <div class="row mt-1">
          <div class="col-lg-12 d-flex">
            <button id="watchButton" class="mx-3" routerLink="/productDetail/{{book().basketBook.id}}">Megtekintés</button>
            <button class="iconButton" (click)="deleteProductFromBasket()">
              <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
